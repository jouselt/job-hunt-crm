# Job Hunt CRM — portable deployment (any Docker host)
#
# Self-contained: postgres + backend (NestJS) + frontend (nginx static).
# The backend self-runs migrations on boot (see backend/docker-entrypoint.sh),
# so a fresh clone + `docker compose up -d` is enough — no manual migration step.
#
# No published ports: a reverse proxy (Caddy/Traefik/nginx) in front of this
# stack routes to the compose network. Two Caddy examples are in Caddyfile.example
# (subpath, with and without Authelia SSO). For local-only testing without a proxy,
# uncomment the `ports:` lines on backend/frontend.
#
# Setup:
#   1. cp .env.example .env        # fill JWT_SECRET (and DB creds if you change them)
#   2. docker compose up -d --build
#   3. docker compose run --rm backend npm run seed   # optional sample data
#
# Secrets: .env is gitignored. Never commit it.

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-job_hunt_crm}
    volumes:
      - /home/shared/data/job-hunt-crm/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobhunt

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Compose-internal DB host; DATABASE_URL in .env should use this host.
      DB_HOST: postgres
      PORT: "3000"
      CORS_ORIGIN: "${CORS_ORIGIN:-}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Published on localhost only (Caddy proxies from the host). Never 0.0.0.0.
    ports:
      - "127.0.0.1:3100:3000"
    networks:
      - jobhunt

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, not localhost: inside the container `localhost` resolves to
      # ::1 first, while nginx listens on 0.0.0.0:80 (IPv4 only). Using
      # `localhost` makes this check a permanent false negative.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    # Published on localhost only (Caddy proxies from the host). Never 0.0.0.0.
    ports:
      - "127.0.0.1:8092:80"
    networks:
      - jobhunt

networks:
  jobhunt:
    name: jobhunt
