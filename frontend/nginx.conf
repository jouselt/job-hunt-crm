server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA fallback for the subpath app
    location /job-hunt-crm/ {
        try_files $uri $uri/ /job-hunt-crm/index.html;
    }

    # Cache hashed assets aggressively
    location /job-hunt-crm/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
