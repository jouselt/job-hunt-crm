name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Sin --fix: en CI el lint reporta, no reescribe el arbol de trabajo.
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npm test

  frontend:
    name: Frontend (tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm test` ya corre headless sin watch, que es lo unico que termina en CI.
      - run: npm test
      - run: npm run build

  scoring-parity:
    name: Scoring rules match the Python source of truth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python tests
        run: python3 -m unittest discover -p "test_*.py"
      # Las reglas y el fixture dorado del scorer se generan desde el Python. Si
      # alguien cambia una regla de un solo lado, esto falla: el diff es la prueba
      # de que las dos implementaciones describen el mismo candidato. El perfil de
      # ejemplo y el corpus estan versionados, y el generador fija su propia fecha,
      # asi que la regeneracion es reproducible en cualquier dia.
      - name: Regenerate the scoring rules and diff
        run: |
          python3 generate_ts_scoring_rules.py --out /tmp/vacancy-rules.ts
          diff /tmp/vacancy-rules.ts ../backend/src/vacancies/vacancy-rules.generated.ts
      - name: Regenerate the golden fixture and diff
        run: |
          python3 generate_scoring_golden.py \
            --profile fixtures/triage-profile.example.json \
            --corpus fixtures/corpus.json \
            --out /tmp/scoring-golden.json
          diff /tmp/scoring-golden.json ../backend/test/fixtures/scoring-golden.json
