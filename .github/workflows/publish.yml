name: Publish images

# Se publican imagenes multi-arch en GHCR para que nadie tenga que compilar. Mucho
# homelab es ARM (Raspberry Pi, cajas ARM), y un `docker compose up` que compila en
# un Pi tarda media hora.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:latest
